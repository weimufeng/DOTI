name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh Tongji snapshot ~00:00 CST without a code push.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Fetch Tongji stats
        continue-on-error: true
        env:
          BAIDU_TONGJI_API_KEY: ${{ secrets.BAIDU_TONGJI_API_KEY }}
          BAIDU_TONGJI_SECRET_KEY: ${{ secrets.BAIDU_TONGJI_SECRET_KEY }}
          BAIDU_TONGJI_REFRESH_TOKEN: ${{ secrets.BAIDU_TONGJI_REFRESH_TOKEN }}
          BAIDU_TONGJI_ACCESS_TOKEN: ${{ secrets.BAIDU_TONGJI_ACCESS_TOKEN }}
          BAIDU_TONGJI_SITE_ID: ${{ secrets.BAIDU_TONGJI_SITE_ID }}
        run: node scripts/fetch-tongji-stats.mjs

      - name: Build
        run: npm run build
        # 统计 ID 写在 web/.env.production（Vite 构建时打进页面）。
        # 若要用 Actions secrets 覆盖，再加 env: VITE_BAIDU_TONGJI_ID。
        # 注意：空 secret 会盖掉 .env.production，所以默认不在这里传。

      # GitHub Pages has no SPA rewrite; serve the app for deep links via 404.html.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
